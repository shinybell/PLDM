# MiniGrid Empty-8x8環境の設定ファイル

env_name: empty_8x8

# データ設定
data:
  dataset_type: MiniGrid
  normalize: true
  min_max_normalize_state: false
  num_workers: 4

  minigrid_config:
    env_name: "MiniGrid-Empty-8x8-v0"
    batch_size: 32
    sample_length: 17
    train: true

    # データソース（要変更: 実際のデータパスを指定）
    online_mode: false
    data_path: /path/to/empty_8x8_train.npz
    val_path: /path/to/empty_8x8_val.npz

    # 画像設定
    img_size: 64
    tile_size: 8
    agent_view_size: null  # null=全体観測

    # MiniGrid設定
    max_steps: 200  # ロングホライズン検証用
    render_mode: null
    highlight: false

    # 前処理
    normalize_images: true
    include_rewards: false
    include_dones: false

    # デバッグ
    quick_debug: false
    crop_length: null
    seed: 42

# モデル設定
hjepa:
  level1:
    backbone:
      arch: resnet18  # シンプルなグリッド環境にはresnet18が適している
    action_dim: 7  # MiniGrid Empty-8x8のアクション数
  disable_l2: true

# 目的関数設定
objectives_l1:
  objectives:
    - VICReg  # 表現学習
    - IDM     # Inverse Dynamics Model（アクション予測）

  vicreg:
    enabled: true
    lambda_inv: 25.0
    lambda_var: 25.0
    lambda_cov: 1.0

  idm:
    enabled: true
    action_dim: 7  # MiniGrid Empty-8x8のアクション数

# 訓練設定
n_steps: 17
val_n_steps: 17
epochs: 100
base_lr: 0.0001
optimizer_type: Adam
optimizer_schedule: Cosine

save_every_n_epochs: 10
eval_every_n_epochs: 20

# 出力設定
output_root: ./outputs
output_dir: minigrid_empty_8x8

# WandB設定
wandb: true
run_name: minigrid_empty_8x8_vicreg
run_project: PLDM-MiniGrid

# 評価設定
eval_cfg:
  env_name: empty_8x8
  eval_l1: true
  eval_l2: false
  disable_planning: true  # 初期実装ではプランニング評価を無効化

  probing:
    probe_preds: true
    probe_encoder: true
    l1_depth: 17
