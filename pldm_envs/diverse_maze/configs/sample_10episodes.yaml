# Diverse Maze サンプルデータ生成用設定（10エピソード）
# テスト・デバッグ用の小規模データセット

env: maze2d_small_diverse
num_blocks_width_in_img: 8
n_episodes: 10  # 10エピソードのみ生成
train_maps_n: 1  # 1つのマップのみ使用
episode_length: 50  # ステップ数を短く（デバッグ用）
img_size: [64, 64, 3]  # 画像サイズ

# 環境設定
qvel_norm_prior: true
qvel_norm_prior_type: uniform
action_repeat: 4
action_repeat_mode: id
resample_every: 1
action_noise: 0
sampling_mode: uniform

# マップ生成設定
max_path_len: 8
sparsity_low: 50
sparsity_high: 75
