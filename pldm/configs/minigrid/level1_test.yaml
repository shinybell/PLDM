# MiniGrid Level1 テスト設定
# 少量データでPLDM学習をテストするための設定

n_steps: &n_steps 16
val_n_steps: *n_steps
env_name: &env_name minigrid_level1

# データ設定
data:
  normalize: false  # 画像は既にデータセット側で正規化される
  min_max_normalize_state: false
  dataset_type: DatasetType.MiniGrid
  num_workers: 0  # テスト時は0
  quick_debug: false

  minigrid_config:
    # データパス
    data_path: "data/minigrid/level1_train_small.npz"
    val_path: "data/minigrid/level1_val_small.npz"

    # データセットパラメータ
    sample_length: *n_steps
    img_size: 72
    normalize_images: true  # [0, 1]に正規化

    # オプション
    include_rewards: false
    include_dones: false

    # 訓練パラメータ
    batch_size: 16  # テスト用に小さめ
    crop_length: null  # 全データを使用
    train: true
    quick_debug: false

# 訓練設定
epochs: 3  # テスト用に少なめ
base_lr: 0.001
optimizer_type: Adam

# モデル設定（HJEPA Level 1）
hjepa:
  train_l1: true
  freeze_l1: false
  disable_l2: true
  l1_n_steps: *n_steps

  level1:
    # バックボーン（画像エンコーダ）
    backbone:
      arch: impala  # IMPALA CNNアーキテクチャ
      backbone_subclass: i
      backbone_mlp: null
      backbone_norm: group_norm
      backbone_pool: dim_reduce
      backbone_final_fc: false
      backbone_width_factor: 1  # IMPALA用は1に設定
      channels: 3  # RGB画像
      input_dim: null
      final_ln: true

    # 予測器（動力学モデル）
    predictor:
      predictor_arch: rnnV2
      predictor_subclass: '512-512'
      rnn_layers: 1
      z_dim: 0
      z_min_std: 0.1
      residual: true
      predictor_ln: true
      tie_backbone_ln: true

    action_dim: 7  # MiniGrid: 7つの離散アクション
    momentum: 0

  step_skip: 4

# 学習目的関数
objectives_l1:
  objectives:
  - VICReg  # VICReg損失
  - IDM     # Inverse Dynamics Model

  vicreg:
    projector: id
    random_projector: false
    sim_coeff: 1.0
    std_coeff: 3.0
    cov_coeff: 6.9238
    std_coeff_t: 0.24535
    cov_coeff_t: 0.0
    sim_coeff_t: 0.74242
    cov_per_feature: false
    adjust_cov: true
    cov_chunk_size: null
    std_margin: 1.0
    std_margin_t: 1.0

  idm:
    coeff: 1.072
    action_dim: 7  # MiniGrid action dimension
    arch: '512'
    arch_subclass: a
    use_pred: false

# チェックポイント
load_checkpoint_path: null
load_l1_only: false

# 評価設定
eval_at_beginning: false
eval_during_training: false
eval_only: false

eval_cfg:
  env_name: *env_name  # minigrid_level1
  eval_l1: true
  eval_l2: false
  disable_planning: false

  # Probing設定
  probing:
    l1_depth: 8  # Probingで使用するシーケンス長
    train_path: null
    val_path: null
    train_images_path: null
    val_images_path: null
    probe_wall: false
    probe_border: false
    probe_encoder: false
    visualize_probing: true
    probe_mpc: false
    epochs: 20
    epochs_enc: 30
    full_finetune: false
    lr: 0.0002
    probe_targets: "locations"
    locations:
      arch: '512'
      subclass: a
    schedule: Constant
    sample_timesteps: 30

  # MiniGrid Planning設定
  minigrid_planning:
    n_envs: 4
    n_steps: 200
    visualize_planning: true
    level: level1
    seed: 42
    error_threshold: 1.0
    max_episode_steps: 1000
    levels: "easy"

    easy:
      n_steps: 200
      n_envs: 4
      max_plan_length: 10
      offline_T: 10
      plot_every: 2

# 出力設定
output_dir: minigrid_level1_test
output_root: /Users/shunsei/works/MatsuoLab/WorldModel/PLDM/checkpoints
run_name: minigrid_level1_test
run_project: PLDM-MiniGrid
wandb: false  # テスト時はWandB無効

# その他
seed: 42
quick_debug: false
