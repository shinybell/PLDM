# MiniGrid Level1 評価設定
# 学習済みモデルからプロービングとプランニング評価を実行

n_steps: &n_steps 16
val_n_steps: *n_steps
env_name: &env_name minigrid_level1

# データ設定
data:
  normalize: false
  min_max_normalize_state: false
  dataset_type: DatasetType.MiniGrid
  num_workers: 0
  quick_debug: false

  minigrid_config:
    # データパス
    data_path: "data/minigrid/level1_train_small.npz"
    val_path: "data/minigrid/level1_val_small.npz"

    # データセットパラメータ
    sample_length: *n_steps
    img_size: 72
    normalize_images: true

    # オプション
    include_rewards: false
    include_dones: false

    # 訓練パラメータ
    batch_size: 16
    crop_length: null
    train: true
    quick_debug: false

# 訓練設定（評価のみなので使用されない）
epochs: 1
base_lr: 0.001
optimizer_type: Adam

# モデル設定（HJEPA Level 1）
hjepa:
  train_l1: true
  freeze_l1: false
  disable_l2: true
  l1_n_steps: *n_steps

  level1:
    backbone:
      arch: impala
      backbone_subclass: i
      backbone_mlp: null
      backbone_norm: group_norm
      backbone_pool: dim_reduce
      backbone_final_fc: false
      backbone_width_factor: 1
      channels: 3
      input_dim: null
      final_ln: true

    predictor:
      predictor_arch: rnnV2
      predictor_subclass: '512-512'
      rnn_layers: 1
      z_dim: 0
      z_min_std: 0.1
      residual: true
      predictor_ln: true
      tie_backbone_ln: true

    action_dim: 7
    momentum: 0

  step_skip: 4

# 学習目的関数
objectives_l1:
  objectives:
  - VICReg
  - IDM

  vicreg:
    projector: id
    random_projector: false
    sim_coeff: 1.0
    std_coeff: 3.0
    cov_coeff: 6.9238
    std_coeff_t: 0.24535
    cov_coeff_t: 0.0
    sim_coeff_t: 0.74242
    cov_per_feature: false
    adjust_cov: true
    cov_chunk_size: null
    std_margin: 1.0
    std_margin_t: 1.0

  idm:
    coeff: 1.072
    action_dim: 7
    arch: '512'
    arch_subclass: a
    use_pred: false

# チェックポイント設定
# IMPORTANT: 学習済みモデルのパスを指定してください
load_checkpoint_path: "checkpoints/minigrid_level1_test/checkpoint_latest.pt"
load_l1_only: false

# 評価設定
eval_at_beginning: false
eval_during_training: false
eval_only: true  # 評価のみ実行

eval_cfg:
  env_name: *env_name
  eval_l1: true
  eval_l2: false
  disable_planning: false  # プランニング評価を有効化

  # Probing設定
  probing:
    l1_depth: 8
    train_path: null
    val_path: null
    train_images_path: null
    val_images_path: null
    probe_wall: false
    probe_border: false
    probe_encoder: false
    visualize_probing: true
    probe_mpc: false
    epochs: 20
    epochs_enc: 30
    full_finetune: false
    lr: 0.0002
    probe_targets: "locations"
    locations:
      arch: '512'
      subclass: a
    schedule: Constant
    sample_timesteps: 30

  # MiniGrid Planning設定
  minigrid_planning:
    n_envs: 4
    n_steps: 200
    visualize_planning: true
    level: level1
    seed: 42
    error_threshold: 1.0
    max_episode_steps: 1000
    levels: "level1"

    level1:
      planner_type: PlannerType.SGD
      max_plan_length: 10
      sgd:
        lr: 0.3

# 出力設定
output_dir: minigrid_level1_eval
output_root: /Users/shunsei/works/MatsuoLab/WorldModel/PLDM/checkpoints
run_name: minigrid_level1_eval
run_project: PLDM-MiniGrid
wandb: false

# その他
seed: 42
quick_debug: false
